<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>التسميع المخفي</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e2e8f0;font-family:'Cairo',sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* setup */
#setup{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:24px;gap:14px}
#setup h1{color:#c8a96e;font-size:22px;font-weight:900;text-align:center}
#setup p{color:#64748b;font-size:13px;text-align:center}
.card{background:#161d2b;border:1px solid #1e2d42;border-radius:16px;padding:18px;width:100%;max-width:420px}
.card label{color:#94a3b8;font-size:12px;display:block;margin-bottom:6px}
.card select{width:100%;background:#0d1117;color:#e2e8f0;border:1px solid #1e2d42;border-radius:10px;padding:10px 12px;font-family:'Cairo';font-size:14px;outline:none}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.hint{color:#4ade80;font-size:12px;text-align:center;margin-top:8px}
.btn-go{width:100%;max-width:420px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;border-radius:14px;padding:15px;font-family:'Cairo';font-weight:900;font-size:17px;cursor:pointer}
.btn-go:active{opacity:.85}

/* session */
#session{display:none;flex-direction:column;height:100vh}
#hdr{background:#0a1020;border-bottom:1px solid #1e2d42;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#hdr-title{color:#c8a96e;font-weight:900;font-size:14px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 8px}
.stat{font-size:13px;font-weight:700;white-space:nowrap;min-width:44px}
.ok{color:#4ade80}.err{color:#f87171}
#btn-x{background:transparent;border:none;color:#475569;font-size:20px;cursor:pointer;padding:2px 6px}

/* page area */
#page{flex:1;overflow-y:auto;padding:14px 12px 6px;direction:rtl}
#grid{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;justify-content:flex-start;direction:rtl}

/* circle */
.ac{
  width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;flex-shrink:0;transition:all .2s;
  border:2px solid #1e2d42;background:#0f1827;color:#374151;
}
.ac.cur{
  border:2.5px solid #c8a96e;background:#1c2510;color:#c8a96e;
  box-shadow:0 0 18px #c8a96e55;animation:glow 1.4s infinite;
}
.ac.er{border-color:#ef4444;background:#1a0808;color:#ef4444;animation:shake .3s}
.ac.done{display:none}

/* revealed */
.rv{
  background:#0b1e10;border:2px solid #16a34a;border-radius:12px;
  padding:10px 14px;width:100%;flex-shrink:0;
  animation:pop .35s ease;
}
.rv .rn{color:#4ade80;font-size:11px;margin-bottom:4px}
.rv .rt{font-family:'Amiri Quran',serif;font-size:22px;line-height:2;color:#bbf7d0;text-align:right;direction:rtl}

/* bottom */
#bot{background:#0a1020;border-top:1px solid #1e2d42;padding:10px 14px 18px;flex-shrink:0}
#heard{text-align:center;min-height:20px;font-size:14px;margin-bottom:6px;font-family:'Amiri Quran',serif;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
#heard.er{color:#f87171}
#stt{text-align:center;font-size:12px;color:#64748b;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px}
#dot{width:8px;height:8px;border-radius:50%;background:#374151;flex-shrink:0;transition:background .3s}
#ctrls{display:flex;align-items:center;justify-content:center;gap:12px}
#mic{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;transition:all .2s;flex-shrink:0}
#mic.on{background:#16a34a;box-shadow:0 0 20px #16a34a88;animation:mpulse 1.5s infinite}
#mic.off{background:#1e293b}
.sbtn{background:transparent;border:1px solid #1e3a5c;border-radius:10px;padding:8px 14px;color:#64748b;font-family:'Cairo';font-size:13px;cursor:pointer}
#done{text-align:center;color:#4ade80;font-weight:900;font-size:18px;margin-bottom:6px;display:none}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;color:#64748b;font-size:14px}
.spin{width:34px;height:34px;border:3px solid #1e2d42;border-top-color:#c8a96e;border-radius:50%;animation:spin .8s linear infinite}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 14px #c8a96e44}50%{box-shadow:0 0 26px #c8a96eaa}}
@keyframes mpulse{0%,100%{box-shadow:0 0 12px #16a34a66}50%{box-shadow:0 0 26px #16a34aaa}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<div id="setup">
  <div style="font-size:46px">🕌</div>
  <h1>وضع التسميع المخفي</h1>
  <p>اختر السورة والنطاق واضغط ابدأ</p>
  <div class="card">
    <label>السورة</label>
    <select id="selS"></select>
  </div>
  <div class="card">
    <div class="row2">
      <div><label>من الآية</label><select id="selF"></select></div>
      <div><label>إلى الآية</label><select id="selT"></select></div>
    </div>
    <div class="hint" id="rhint">— آية</div>
  </div>
  <button class="btn-go" id="btnGo">🎙 ابدأ التسميع المخفي</button>
</div>

<div id="session">
  <div id="hdr">
    <span class="stat ok" id="stOk">&#10003; 0</span>
    <div id="hdr-title">—</div>
    <span class="stat err" id="stErr">&#10007; 0</span>
    <button id="btn-x" onclick="endSess()">&#10005;</button>
  </div>
  <div id="page">
    <div id="loading"><div class="spin"></div><span>تحميل الآيات…</span></div>
    <div id="grid" style="display:none"></div>
  </div>
  <div id="bot">
    <div id="done">&#127881; أتممت التسميع! أحسنت</div>
    <div id="heard"></div>
    <div id="stt"><span id="dot"></span><span id="stxt">اضغط الميكروفون</span></div>
    <div id="ctrls">
      <button class="sbtn" onclick="resetSess()">&#128260; إعادة</button>
      <button id="mic" class="off" onclick="toggleMic()">&#127897;</button>
      <button class="sbtn" onclick="endSess()">&#10005; خروج</button>
    </div>
  </div>
</div>

<script>
var allSurahs=[], ayahs=[], curIdx=0, okCnt=0, errCnt=0;
var listening=false, recog=null, advancing=false;

// ---- beep ----
function beep(){
  try{
    var c=new(window.AudioContext||window.webkitAudioContext)();
    var o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(.4,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.45);
    o.start();o.stop(c.currentTime+.45);
    setTimeout(function(){c.close()},1000);
  }catch(e){}
}

// ---- process spoken text ----
function onSpoken(text, isFinal){
  if(curIdx>=ayahs.length||advancing) return;
  var txt=text.trim();
  document.getElementById('heard').textContent=txt?('&#128249; '+txt):'';

  // any Arabic word (2+ chars) = CORRECT
  var arabicWords=txt.split(/\s+/).filter(function(w){return w.length>=2&&/[؀-ۿ]/.test(w);});
  if(arabicWords.length>0){
    advancing=true;
    doReveal();
  } else if(isFinal && txt.length>0){
    // final result with no Arabic = wrong
    doError();
  }
}

function doReveal(){
  var idx=curIdx;
  var c=document.getElementById('c'+idx);
  var r=document.getElementById('r'+idx);
  if(c){c.className='ac done';}
  if(r){
    r.style.display='block';
    r.scrollIntoView({behavior:'smooth',block:'center'});
  }
  okCnt++;
  document.getElementById('stOk').innerHTML='&#10003; '+okCnt;
  document.getElementById('heard').textContent='';

  curIdx++;
  if(curIdx>=ayahs.length){
    stopListen();
    document.getElementById('done').style.display='block';
    setStt('&#127881; أتممت التسميع!');
    advancing=false;
    return;
  }
  activateCircle(curIdx);
  setStt('اقرأ الآية '+ayahs[curIdx].numberInSurah+'…');
  // small pause then resume
  setTimeout(function(){advancing=false;},400);
}

function doError(){
  errCnt++;
  document.getElementById('stErr').innerHTML='&#10007; '+errCnt;
  var c=document.getElementById('c'+curIdx);
  if(c){
    c.classList.add('er');
    setTimeout(function(){c.classList.remove('er');},600);
  }
  beep();
  document.getElementById('heard').className='er';
  setTimeout(function(){document.getElementById('heard').className='';},700);
}

function activateCircle(idx){
  document.querySelectorAll('.ac.cur').forEach(function(el){el.classList.remove('cur');});
  var c=document.getElementById('c'+idx);
  if(c){c.classList.add('cur');c.scrollIntoView({behavior:'smooth',block:'center'});}
}

function setStt(t){document.getElementById('stxt').textContent=t;}

// ---- speech recognition ----
// Use non-continuous (more reliable) with instant restart
function startListen(){
  stopListen();
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('يحتاج Chrome أو Edge');return;}
  listening=true;
  document.getElementById('mic').className='on';
  document.getElementById('mic').textContent='🔴';
  document.getElementById('dot').style.background='#ef4444';
  setStt('اقرأ الآية '+ayahs[curIdx]?.numberInSurah+'…');
  runSession();
}

function runSession(){
  if(!listening||curIdx>=ayahs.length) return;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var r=new SR();
  r.lang='ar-SA';
  r.continuous=false;
  r.interimResults=true;
  r.maxAlternatives=1;

  var heard='', processed=false, restarting=false;

  function restart(ms){
    if(restarting) return;
    restarting=true;
    setTimeout(function(){if(listening) runSession();},ms||60);
  }

  r.onresult=function(ev){
    var final='', interim='';
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      if(ev.results[i].isFinal) final+=ev.results[i][0].transcript+' ';
      else interim+=ev.results[i][0].transcript;
    }
    if(interim) onSpoken(interim,false);
    if(final && !processed){
      heard=final.trim();
      // process final immediately
      processed=true;
      onSpoken(heard,true);
    }
  };

  r.onend=function(){
    recog=null;
    // If user just correctly read → short pause before restart (doReveal sets advancing=false after 400ms)
    restart(advancing?500:60);
  };

  r.onerror=function(ev){
    recog=null;
    if(ev.error==='aborted'||ev.error==='not-allowed') return;
    restart(200);
  };

  recog=r;
  try{r.start();}catch(e){recog=null;restart(300);}
}

function stopListen(){
  listening=false;
  if(recog){try{recog.abort();}catch(e){}recog=null;}
  document.getElementById('mic').className='off';
  document.getElementById('mic').innerHTML='&#127897;';
  document.getElementById('dot').style.background='#374151';
  setStt('متوقف — اضغط الميكروفون');
}

function toggleMic(){if(listening)stopListen();else startListen();}

// ---- build grid ----
function buildGrid(){
  var g=document.getElementById('grid');
  g.innerHTML='';
  ayahs.forEach(function(a,i){
    var c=document.createElement('div');
    c.className='ac'+(i===0?' cur':'');
    c.id='c'+i;
    c.textContent=a.numberInSurah;
    g.appendChild(c);

    var rv=document.createElement('div');
    rv.className='rv';rv.id='r'+i;rv.style.display='none';
    rv.innerHTML='<div class="rn">&#10003; آية '+a.numberInSurah+'</div>'
                +'<div class="rt">'+a.text+'</div>';
    g.appendChild(rv);
  });
}

// ---- session start/reset/end ----
function startSession(list,title){
  ayahs=list;curIdx=0;okCnt=0;errCnt=0;advancing=false;
  document.getElementById('stOk').innerHTML='&#10003; 0';
  document.getElementById('stErr').innerHTML='&#10007; 0';
  document.getElementById('hdr-title').textContent=title;
  document.getElementById('done').style.display='none';
  document.getElementById('heard').textContent='';
  document.getElementById('setup').style.display='none';
  document.getElementById('session').style.display='flex';
  document.getElementById('loading').style.display='flex';
  document.getElementById('grid').style.display='none';
  buildGrid();
  document.getElementById('loading').style.display='none';
  document.getElementById('grid').style.display='flex';
  startListen();
}

function resetSess(){
  stopListen();
  curIdx=0;okCnt=0;errCnt=0;advancing=false;
  document.getElementById('stOk').innerHTML='&#10003; 0';
  document.getElementById('stErr').innerHTML='&#10007; 0';
  document.getElementById('done').style.display='none';
  document.getElementById('heard').textContent='';
  buildGrid();
  startListen();
}

function endSess(){
  stopListen();
  document.getElementById('session').style.display='none';
  document.getElementById('setup').style.display='flex';
}

// ---- surah list ----
function loadSurahs(){
  fetch('https://api.alquran.cloud/v1/surah')
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.code!==200) throw 0;
      allSurahs=d.data;
      var sel=document.getElementById('selS');
      sel.innerHTML='';
      allSurahs.forEach(function(s){
        var o=document.createElement('option');
        o.value=s.number;
        o.textContent=s.number+'. '+s.name+' ('+s.numberOfAyahs+' آية)';
        sel.appendChild(o);
      });
      updateRange();
    })
    .catch(function(){document.getElementById('selS').innerHTML='<option>فشل التحميل</option>';});
}

function updateRange(){
  var n=+document.getElementById('selS').value;
  var s=allSurahs.find(function(x){return x.number===n;});
  if(!s) return;
  var tot=s.numberOfAyahs;
  var sf=document.getElementById('selF'), st=document.getElementById('selT');
  var pf=+sf.value||1, pt=+st.value||Math.min(10,tot);
  sf.innerHTML='';st.innerHTML='';
  for(var i=1;i<=tot;i++){
    sf.innerHTML+='<option value="'+i+'"'+(i===pf?' selected':'')+'>الآية '+i+'</option>';
    st.innerHTML+='<option value="'+i+'"'+(i===pt?' selected':'')+'>الآية '+i+'</option>';
  }
  sf.value=Math.min(pf,tot); st.value=Math.min(pt,tot);
  updateHint();
}

function updateHint(){
  var f=+document.getElementById('selF').value, t=+document.getElementById('selT').value;
  document.getElementById('rhint').textContent=(Math.max(1,t-f+1))+' آية مختارة';
}

document.getElementById('selS').addEventListener('change',updateRange);
document.getElementById('selF').addEventListener('change',function(){
  var f=+document.getElementById('selF').value, st=document.getElementById('selT');
  if(+st.value<f) st.value=f; updateHint();
});
document.getElementById('selT').addEventListener('change',updateHint);

document.getElementById('btnGo').addEventListener('click',function(){
  var n=+document.getElementById('selS').value;
  var f=+document.getElementById('selF').value, t=+document.getElementById('selT').value;
  if(!n||f>t) return;
  var s=allSurahs.find(function(x){return x.number===n;});
  var btn=document.getElementById('btnGo');
  btn.textContent='⏳ تحميل…';btn.disabled=true;
  fetch('https://api.alquran.cloud/v1/surah/'+n+'/quran-uthmani')
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.code!==200) throw 0;
      var list=d.data.ayahs.filter(function(a){return a.numberInSurah>=f&&a.numberInSurah<=t;});
      startSession(list, s.name+' — الآيات '+f+'-'+t);
    })
    .catch(function(){alert('فشل التحميل');})
    .finally(function(){btn.textContent='🎙 ابدأ التسميع المخفي';btn.disabled=false;});
});

loadSurahs();
</script>
</body>
</html>
